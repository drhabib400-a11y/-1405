<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انبارداری مطب دندانپزشکی دکتر حبیب الله قنبری</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:linear-gradient(135deg,#0369a1,#0284c7);color:white;padding:18px;text-align:center;box-shadow:0 3px 12px #0002}
header h1{margin:0;font-size:21px}header small{opacity:.9}
nav{display:flex;gap:8px;padding:12px;max-width:1100px;margin:auto;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 15px;font-family:inherit;cursor:pointer}
.navbtn{background:white;color:#0369a1;border:1px solid #bae6fd}.navbtn.active{background:#0369a1;color:white}
.container{max-width:1100px;margin:auto;padding:0 12px 30px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:12px;background:#e0f2fe;text-align:center}.stat b{display:block;font-size:24px;color:#0369a1;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}label{font-size:13px;font-weight:bold}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;width:100%;background:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:#0284c7;color:white}.success{background:#16a34a;color:white}.danger{background:#dc2626;color:white}.secondary{background:#e2e8f0;color:#334155}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}th{background:#f8fafc;color:#334155}
.badge{padding:4px 8px;border-radius:20px;font-size:11px}.ok{background:#dcfce7;color:#166534}.low{background:#fee2e2;color:#991b1b}
.search{margin-bottom:8px}.hidden{display:none}.empty{text-align:center;color:#64748b;padding:25px}.selected-row{background:#e0f2fe!important;outline:2px solid #0284c7;outline-offset:-2px}.selected-row td:first-child:before{content:"✓ ";color:#0284c7;font-weight:bold}.selected-row{background:#e0f2fe!important;outline:2px solid #0284c7}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}header h1{font-size:18px}}
</style>
</head>
<body>
<header>
<h1>مدیریت انبار مطب دندانپزشکی</h1>
<small>دکتر حبیب الله قنبری | موجودی، خرید و مصرف</small>
</header>

<nav>
<button class="navbtn active" onclick="showTab('dashboard',this)">داشبورد</button>
<button class="navbtn" onclick="showTab('instruments',this)">اینسترومنت‌ها</button>
<button class="navbtn" onclick="showTab('materials',this)">مواد مصرفی</button>
<button class="navbtn" onclick="showTab('movement',this)">ورود / خروج</button>
</nav>

<div class="container">

<section id="dashboard" class="tab">
<div class="stats">
<div class="stat">کل اقلام<b id="totalItems">0</b></div>
<div class="stat">موجودی کل<b id="totalQty">0</b></div>
<div class="stat">اقلام کم‌موجود<b id="lowItems">0</b></div>
<div class="stat">حرکت‌های ثبت‌شده<b id="moveCount">0</b></div>
</div>
<div class="card">
<h3>⚠️ هشدار موجودی کم</h3>
<div id="lowList"></div>
</div>
<div class="card">
<h3>آخرین گردش انبار</h3>
<div id="recentMoves"></div>
</div>
</section>

<section id="instruments" class="tab hidden">
<div class="card">
<h3>افزودن اینسترومنت</h3>
<div class="grid">
<div class="field"><label>نام اینسترومنت</label><input id="iName" placeholder="مثلاً آینه، سوند، کارور"></div>
<div class="field"><label>تعداد اولیه</label><input id="iQty" type="number" min="0" value="0"></div>
<div class="field"><label>حداقل موجودی</label><input id="iMin" type="number" min="0" value="2"></div>
<div class="field"><label>توضیحات</label><input id="iNote" placeholder="اختیاری"></div>
</div>
<div class="actions"><button class="primary" onclick="addItem('instrument')">➕ ثبت اینسترومنت</button></div>
</div>
<div class="card">
<input class="search" id="iSearch" oninput="render()" placeholder="🔎 جست‌وجوی اینسترومنت">
<div id="instrumentTable"></div>
</div>
</section>

<section id="materials" class="tab hidden">
<div class="card">
<h3>افزودن ماده مصرفی</h3>
<div class="grid">
<div class="field"><label>نام ماده</label><input id="mName" placeholder="مثلاً کامپوزیت، باند، آلژینات"></div>
<div class="field"><label>برند</label><input id="mBrand" placeholder="مثلاً 3M، Tokuyama"></div>
<div class="field"><label>نوع / رنگ / مشخصات</label><input id="mType" placeholder="اختیاری"></div>
<div class="field"><label>تعداد اولیه</label><input id="mQty" type="number" min="0" value="0"></div>
<div class="field"><label>حداقل موجودی</label><input id="mMin" type="number" min="0" value="1"></div>
<div class="field"><label>تاریخ انقضا</label><input id="mExp" type="date"></div>
</div>
<div class="actions"><button class="primary" onclick="addItem('material')">➕ ثبت ماده</button></div>
</div>
<div class="card">
<input class="search" id="mSearch" oninput="render()" placeholder="🔎 جست‌وجو بر اساس نام یا برند">
<div id="materialTable"></div>
</div>
</section>

<section id="movement" class="tab hidden">
<div class="card">
<h3>ثبت ورود / خروج از انبار</h3>
<div class="grid">
<div class="field"><label>نوع عملیات</label><select id="moveType"><option value="in">ورود / خرید ➕</option><option value="out">خروج / مصرف ➖</option></select></div>
<div class="field"><label>قلم موردنظر</label><select id="moveItem"></select></div>
<div class="field"><label>تعداد</label><input id="moveQty" type="number" min="1" value="1"></div>
<div class="field"><label>علت / توضیح</label><input id="moveNote" placeholder="مثلاً خرید جدید، مصرف بیمار"></div>
</div>
<div class="actions"><button class="success" onclick="saveMove()">💾 ثبت عملیات</button></div>
</div>
<div class="card">
<h3>گردش انبار</h3>
<div id="movementTable"></div>
</div>
</section>

</div>

<script>
const KEY='dental_inventory_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"moves":[]}');

function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function showTab(id,btn){
 document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active'); render();
}
function val(id){return document.getElementById(id).value.trim()}
function addItem(type){
 let name=type==='instrument'?val('iName'):val('mName');
 if(!name){alert('نام قلم را وارد کنید.');return}
 let item={
 id:Date.now(),type,name,
 brand:type==='material'?val('mBrand'):'',
 spec:type==='material'?val('mType'):'',
 qty:Number(type==='instrument'?val('iQty'):val('mQty'))||0,
 min:Number(type==='instrument'?val('iMin'):val('mMin'))||0,
 exp:type==='material'?val('mExp'):'',
 note:type==='instrument'?val('iNote'):''
 };
 db.items.push(item);save();
 ['iName','iQty','iMin','iNote','mName','mBrand','mType','mQty','mMin','mExp'].forEach(id=>{let e=document.getElementById(id);if(e)e.value=id.includes('Qty')||id.includes('Min')?'0':''});
 alert('قلم با موفقیت ثبت شد.');
}
let selectedItemId=null;
function selectItem(id){selectedItemId=id;render()}
function editItem(id){
 let x=db.items.find(i=>i.id===id); if(!x)return;
 selectedItemId=id;
 let name=prompt('نام قلم',x.name); if(name===null)return;
 let qty=prompt('موجودی فعلی',x.qty); if(qty===null)return;
 let min=prompt('حداقل موجودی',x.min); if(min===null)return;
 x.name=name.trim()||x.name;
 if(!isNaN(qty))x.qty=Math.max(0,Number(qty));
 if(!isNaN(min))x.min=Math.max(0,Number(min));
 if(x.type==='material'){
  let brand=prompt('برند',x.brand||''); if(brand!==null)x.brand=brand.trim();
  let spec=prompt('نوع / رنگ / مشخصات',x.spec||''); if(spec!==null)x.spec=spec.trim();
 }else{
  let note=prompt('توضیحات',x.note||''); if(note!==null)x.note=note.trim();
 }
 save(); alert('اطلاعات قلم اصلاح شد.');
}
function editSelected(){
 if(!selectedItemId){alert('ابتدا یک قلم را از لیست انتخاب کنید.');return}
 editItem(selectedItemId);
}
function deleteItem(id){
 if(confirm('این قلم حذف شود؟')){db.items=db.items.filter(x=>x.id!==id);if(selectedItemId===id)selectedItemId=null;save()}
}
function saveMove(){
 let id=Number(document.getElementById('moveItem').value), item=db.items.find(x=>x.id===id);
 let qty=Number(val('moveQty')); let type=val('moveType');
 if(!item||qty<=0){alert('قلم و تعداد را مشخص کنید.');return}
 if(type==='out'&&qty>item.qty){alert('موجودی کافی نیست.');return}
 item.qty += type==='in'?qty:-qty;
 db.moves.unshift({date:new Date().toLocaleString('fa-IR'),item:item.name,brand:item.brand,type,qty,note:val('moveNote')});
 document.getElementById('moveQty').value=1;document.getElementById('moveNote').value='';
 save();alert('عملیات ثبت شد.');
}
function table(items){
 if(!items.length)return '<div class="empty">هنوز موردی ثبت نشده است.</div>';
 return '<div class="actions"><button class="primary" onclick="editSelected()">✏️ اصلاح قلم انتخاب‌شده</button></div>'+
 '<table><thead><tr><th>نام</th><th>برند/مشخصات</th><th>موجودی</th><th>حداقل</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+
 items.map(x=>`<tr class="${selectedItemId===x.id?'selected-row':''}" onclick="selectItem(${x.id})" title="برای انتخاب کلیک کنید"><td>${x.name}</td><td>${x.brand||'-'} ${x.spec?'<br>'+x.spec:''}</td><td>${x.qty}</td><td>${x.min}</td><td>${x.qty<=x.min?'<span class="badge low">کمبود</span>':'<span class="badge ok">مناسب</span>'}</td><td><button class="secondary" onclick="event.stopPropagation();editItem(${x.id})">✏️ اصلاح</button> <button class="danger" onclick="event.stopPropagation();deleteItem(${x.id})">🗑️</button></td></tr>`).join('')+'</tbody></table>';
}
function render(){
 let is=db.items.filter(x=>x.type==='instrument'), ms=db.items.filter(x=>x.type==='material');
 let iq=val('iSearch').toLowerCase(), mq=val('mSearch').toLowerCase();
 if(iq)is=is.filter(x=>x.name.toLowerCase().includes(iq));
 if(mq)ms=ms.filter(x=>(x.name+' '+x.brand).toLowerCase().includes(mq));
 document.getElementById('instrumentTable').innerHTML=table(is);
 document.getElementById('materialTable').innerHTML=table(ms);
 document.getElementById('totalItems').textContent=db.items.length;
 document.getElementById('totalQty').textContent=db.items.reduce((a,x)=>a+x.qty,0);
 let low=db.items.filter(x=>x.qty<=x.min);
 document.getElementById('lowItems').textContent=low.length;
 document.getElementById('moveCount').textContent=db.moves.length;
 document.getElementById('lowList').innerHTML=low.length?'<ul>'+low.map(x=>`<li>${x.name}${x.brand?' - '+x.brand:''}: <b>${x.qty}</b> عدد</li>`).join('')+'</ul>':'<div class="empty">مورد کم‌موجود وجود ندارد.</div>';
 document.getElementById('recentMoves').innerHTML=db.moves.length?'<table><tr><th>تاریخ</th><th>قلم</th><th>عملیات</th><th>تعداد</th><th>توضیح</th></tr>'+db.moves.slice(0,10).map(x=>`<tr><td>${x.date}</td><td>${x.item}${x.brand?' - '+x.brand:''}</td><td>${x.type==='in'?'ورود ➕':'خروج ➖'}</td><td>${x.qty}</td><td>${x.note||'-'}</td></tr>`).join('')+'</table>':'<div class="empty">گردشی ثبت نشده است.</div>';
 let sel=document.getElementById('moveItem'), old=sel.value;
 sel.innerHTML=db.items.map(x=>`<option value="${x.id}">${x.name}${x.brand?' - '+x.brand:''} | موجودی: ${x.qty}</option>`).join('');
 if([...sel.options].some(o=>o.value===old))sel.value=old;
 document.getElementById('movementTable').innerHTML=db.moves.length?'<table><tr><th>تاریخ</th><th>قلم</th><th>برند</th><th>نوع</th><th>تعداد</th><th>توضیح</th></tr>'+db.moves.map(x=>`<tr><td>${x.date}</td><td>${x.item}</td><td>${x.brand||'-'}</td><td>${x.type==='in'?'ورود / خرید':'خروج / مصرف'}</td><td>${x.qty}</td><td>${x.note||'-'}</td></tr>`).join('')+'</table>':'<div class="empty">گردشی ثبت نشده است.</div>';
}
render();
</script>
</body>
</html>
